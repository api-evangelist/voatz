name: Voatz
description: >-
  Voatz is a remote voting technology company providing secure, mobile-based
  voting for public elections and organizational governance. Voters cast ballots
  from a smartphone, tablet, or web browser, with identity assured through
  hardware-backed authentication and biometric verification, ballots anchored to
  a permissioned blockchain, and a voter-verifiable paper audit trail produced
  for every vote. The platform pairs the voter-facing mobile app with an
  administrative dashboard for election officials and supports accessibility
  features for voters with disabilities. Voatz has run elections across seven
  countries for more than five million voters, with pilots and deployments for
  U.S. counties (West Virginia, Utah County, Denver), political parties, and
  international election authorities. The company is a Techstars-backed startup.
  Voatz publishes no public developer API; its surface is a security, audit, and
  disclosure program rather than an integration platform.
